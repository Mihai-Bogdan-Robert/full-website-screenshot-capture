services:
  web:
    build: .
    container_name: full-website-captures
    ports:
      # Only this computer can reach it. Change to "5001:5001" to expose it on your network.
      - "127.0.0.1:5001:5001"
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      # - ALLOW_PRIVATE_URLS=1   # allow capturing localhost / private-network sites
      # - ALLOWED_ORIGINS=https://your-domain.example   # when the app is reachable from the internet
    restart: unless-stopped
    mem_limit: 2g
