services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webcapture-backend
    ports:
      - "5001:5000"
    volumes:
      # Mount frontend so Flask can serve it without rebuilding the image
      - ./frontend:/app/frontend:ro
    environment:
      - PORT=5000
      - WEB_INTERFACE_DIR=/app/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
